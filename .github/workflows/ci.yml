name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
      - name: Type check
        run: uv run --with pyright pyright
      - name: Migration round-trip
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/ci-migrations.db
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
